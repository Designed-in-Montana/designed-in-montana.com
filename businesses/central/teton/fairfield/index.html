<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairfield · Teton County · Designed in Montana</title>
  <meta name="description" content="Businesses in Fairfield, Teton County, Central Montana.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .breadcrumb { font-size: 13px; color: var(--fg-muted); margin-bottom: 18px; letter-spacing: 0.06em; text-transform: uppercase; }
    .breadcrumb a { color: var(--fg-muted); }
    .breadcrumb a:hover { color: var(--accent-warm); }
  </style>
</head>
<body>

  <div id="site-header-slot"></div>

  <main>

    <section class="page-header">
      <div class="container">
        <div class="breadcrumb">
          <a href="/index.html">Home</a> /
          <a href="/businesses/central/">Central Montana</a> /
          <a href="/businesses/central/teton/">Teton County</a> /
          Fairfield
        </div>
        <div class="eyebrow">Teton County · Central Montana</div>
        <h1>Fairfield</h1>
        <p class="lede">"Malting Barley Capital of the United States" — Fairfield sits in the heart of the Greenfields Bench, a stretch of irrigated farmland against the Rocky Mountain Front.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title">Businesses in Fairfield</h2>
        <div class="business-grid" id="town-businesses"></div>
      </div>
    </section>

  </main>

  <div id="site-footer-slot"></div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/businesses.js"></script>
  <script src="/assets/js/business-loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const all = await window.MTBiz.loadAllBusinesses();
      const here = all.filter(b => b.region === 'central' && b.county === 'teton' && b.town === 'fairfield');
      window.MTBiz.renderCards(document.getElementById('town-businesses'), here);
    });
  </script>

</body>
</html>
