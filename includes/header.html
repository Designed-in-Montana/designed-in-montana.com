<!--
  =========================================================================
  GLOBAL HEADER  ·  /includes/header.html
  Edit this file to update the header on EVERY page of the site.
  Favicon links are also in here so they update everywhere at once.
  =========================================================================
-->
<header class="site-header">
  <div class="container">

    <a href="/index.html" class="brand" aria-label="Designed in Montana, home">
      <img src="/assets/images/logo/logo-header.png" alt="" class="brand-img" width="107" height="48" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-name">Designed in Montana</span>
        <span class="brand-tag">Big Sky Businesses</span>
      </span>
    </a>

    <button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false" id="mobile-toggle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <nav class="nav" id="main-nav">
      <a href="/pages/regions.html" data-nav="regions">Regions</a>
      <a href="/pages/about.html" data-nav="about">About</a>
      <a href="/pages/requirements.html" data-nav="requirements">Requirements</a>
      <a href="/pages/contact.html" data-nav="contact">Contact Us</a>
    </nav>

    <form class="header-search" role="search" action="/pages/search.html" method="get" id="header-search-form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" name="q" placeholder="Search businesses, towns, tags…" aria-label="Search businesses">
    </form>

  </div>
</header>
